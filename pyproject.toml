[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "codex-farm"
version = "0.1.0"
description = "CLI-first local worker farm for codex exec pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CodexFarm" }]
dependencies = [
  "typer>=0.12.5,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "rich>=13.9.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
codex-farm = "codex_farm.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_farm"]
